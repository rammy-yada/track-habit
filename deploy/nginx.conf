# Load balancer for HabitFlow.
#
# Every app container is identical and keeps no state of its own — the login
# session lives in the browser's encrypted cookie and the data in Postgres — so
# any request can go to any container. No sticky sessions needed.

events {
  worker_connections 1024;
}

http {
  # Docker's DNS returns one address per running "app" container.
  # `resolve` re-reads that list, so scaling up or down needs no restart.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream habitflow {
    zone habitflow 64k;
    least_conn;                                        # send each request to the least busy container
    server app:3000 resolve max_fails=2 fail_timeout=10s;  # stop using a container that keeps failing
    keepalive 32;
  }

  # at most 20 requests/second per visitor, with short bursts allowed
  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 80;
    server_tokens off;
    client_max_body_size 1m;

    location / {
      limit_req zone=per_ip burst=40 nodelay;

      proxy_pass http://habitflow;
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      # The app needs to know the address the visitor actually used:
      # for secure cookies, and to accept form posts (Server Actions).
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # if one container fails mid-request, quietly try another
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }

    # built assets never change for a given build: let browsers keep them
    location /_next/static/ {
      proxy_pass http://habitflow;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }
}
