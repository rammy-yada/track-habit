<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — HabitFlow</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f7fb; --ink: #0d1220; --muted: #5a6478; --brand: #2563eb; }
      @media (prefers-color-scheme: dark) { :root { --bg: #090c13; --ink: #eef1f8; --muted: #98a2b7; --brand: #3570ee; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 1.5rem; margin: 20px 0 8px; }
      p { color: var(--muted); max-width: 22rem; margin: 0 auto 24px; line-height: 1.5; font-size: 0.95rem; }
      button { background: var(--brand); color: #fff; border: 0; border-radius: 12px; padding: 12px 24px; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>HabitFlow needs a connection to load and save your habits. Nothing is lost — reconnect and pick up where you left off.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
